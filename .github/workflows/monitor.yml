name: Monitor diário de passagens

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python monitor.py
        env:
          IGNAV_KEY: ${{ secrets.IGNAV_KEY }}
      - run: |
          git config user.name "robo-monitor"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add passagens_rec_lis.csv
          git commit -m "Coleta de $(date +%F)" || echo "Nada novo"
          git push
